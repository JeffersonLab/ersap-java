# Example Prometheus scrape configuration for the ERSAP Monitor FE exporter.
#
# Copy the `scrape_configs` entry into your prometheus.yml, or run Prometheus
# directly against this file:
#
#   prometheus --config.file=prometheus-example.yml
#
# 9095 is the exporter default (--prometheus-port).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ersap-monitor"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "localhost:9095"
        labels:
          # Optional: tag the whole target. Prefer this over --label when the
          # value describes where the exporter runs rather than what it exports.
          deployment: "lab"

    # The Monitor FE republishes DPE reports every report period (10 s by
    # default) and user metrics as fast as engines publish them. Scraping
    # faster than the DPE report period only repeats the same samples.
    scrape_interval: 15s
    scrape_timeout: 10s


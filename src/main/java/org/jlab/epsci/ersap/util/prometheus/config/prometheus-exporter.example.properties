# Example configuration for the ERSAP Prometheus exporter.
#
#   java -cp "$ERSAP_HOME/lib/*" \
#        org.jlab.epsci.ersap.util.prometheus.PrometheusExporter \
#        --config /path/to/prometheus-exporter.properties
#
# Keys are the long option names without the leading dashes; every key is
# optional and falls back to the built-in default. Precedence is
#
#   defaults  <  this file  <  environment (ERSAP_PROM_*)  <  command line
#
# Run the exporter with --help for the authoritative list of options.

# ---------------------------------------------------------------------------
# Monitor FE subscription
# ---------------------------------------------------------------------------

# Host or IP of the Monitor FE DPE. ERSAP canonical names only accept IP
# addresses, so prefer a dotted-decimal address over a hostname.
# Default: the host of $ERSAP_MONITOR_FE, or localhost.
monitor-host = localhost

# Port of the Monitor FE proxy. The Monitor FE must be started with
# `j_dpe --port 9000`; DataRingAddress always connects to MONITOR_PORT = 9000.
# Default: the port of $ERSAP_MONITOR_FE, or 9000.
monitor-port = 9000

# ERSAP session to filter reports on; must match the DPE's --session.
# Use * to subscribe to every session.
# Default: test
session = test

# Restrict the userMetrics subscription to a single canonical engine name.
# Leave unset to export the metrics of every engine.
# engine = 10.1.1.10_java:user:EventRateMonitor

# ---------------------------------------------------------------------------
# Prometheus endpoint
# ---------------------------------------------------------------------------

prometheus-host = 0.0.0.0
prometheus-port = 9095

# ---------------------------------------------------------------------------
# Metric naming and shaping
# ---------------------------------------------------------------------------

# Prefix prepended to every exported metric name.
metric-prefix = ersap

# Labels added to every exported series. Comma-separated name=value pairs.
# Keep the cardinality bounded: these multiply every time series.
# label = cluster=jlab,deployment=lab

# Include/exclude filters, matched against the final metric name (prefix
# included). Globs by default (* and ?); wrap a pattern in slashes for a
# regular expression. Exclude wins over include. Comma-separated.
# Exporter self-metrics are never filtered.
#
#   include = ersap_user_*,ersap_service_*
#   exclude = ersap_container_*
#   exclude = /^ersap_dpe_(memory_size|start_time)_.*$/

# Regex deciding which user metrics become counters instead of gauges. It is
# matched against the sanitized name, case-insensitively. Set it to an empty
# value to make every user metric a gauge.
# counter-pattern = ^total_.*|.*_(total|count|counter)$

# Cap on the number of exported time series. Protects the exporter from an
# engine that publishes unbounded metric names.
max-series = 20000

# Also export <prefix>metric_last_update_timestamp_seconds, one series per
# exported series. Off by default because it doubles the cardinality.
export-timestamps = false

# ---------------------------------------------------------------------------
# Reliability and logging
# ---------------------------------------------------------------------------

# Seconds to wait between Monitor FE subscription attempts.
reconnect-interval = 10

# Rebuild the subscription after this many seconds of silence. 0 disables it.
# Only useful for a pipeline that is expected to publish continuously: an idle
# pipeline legitimately publishes nothing, and a non-zero value would then
# resubscribe forever.
stale-timeout = 0

# Also export the JVM metrics of the exporter process itself.
jvm-metrics = false

# trace, debug, info, warn, error, off
log-level = info

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # PrometheusReporter (j_pr) aggregates and re-exposes metrics for every
  # DPE reporting to the front-end it is subscribed to. One target here
  # covers the whole DPE fleet behind that front-end.
  - job_name: ersap-prometheus-reporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      # CHANGE ME: host:port where `j_pr` is running (--metrics-port, default 9200)
      - targets: ["monitoring-host.example.org:9200"]
        labels:
          # CHANGE ME (or remove): match the --session the DPEs were started with
          session: "prod"
